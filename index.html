<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfoli | Tècnic/a en SMX</title>
    <style>
        /* Variables per al MODE NIT (per defecte) */
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #94a3b8;
            --text-title: #f8fafc;
            --border: #334155;
            --badge-bg: rgba(74, 222, 128, 0.15);
            --badge-text: #4ade80;
            --tag-bg: rgba(56, 189, 248, 0.15);
            --btn-bg: #334155;
        }

        /* Variables per al MODE DIA */
        body.light-mode {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --accent: #0284c7;
            --text: #475569;
            --text-title: #0f172a;
            --border: #e2e8f0;
            --badge-bg: #dcfce7;
            --badge-text: #166534;
            --tag-bg: #e0f2fe;
            --btn-bg: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        /* Barra superior amb el botó de canvi de tema */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .theme-btn {
            background-color: var(--btn-bg);
            color: var(--text-title);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        /* Capçalera amb foto de perfil */
        header {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
            display: flex;
            gap: 25px;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
